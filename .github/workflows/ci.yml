name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: gofmt -l .

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install edge-api dependencies
        working-directory: edge-api
        run: npm install

      - name: edge-api typecheck
        working-directory: edge-api
        run: npm run typecheck

  deploy-pages:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inject Cloudflare Web Analytics token into decoy site
        run: |
          find decoys/ai-compute -name '*.html' -exec sed -i "s/{{CF_WEB_ANALYTICS_TOKEN}}/${{ secrets.CF_WEB_ANALYTICS_TOKEN }}/g" {} +

      - name: Deploy decoy site to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          directory: decoys/ai-compute
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          projectName: nullpot-decoy

      - name: Deploy edge-api Worker to Cloudflare
        working-directory: edge-api
        run: |
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
