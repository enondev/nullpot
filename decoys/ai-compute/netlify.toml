# Netlify configuration for Nexus Compute decoy site
[build]
  publish = "."
  command = "echo 'static site, no build step'"

[[redirects]]
  from = "/admin"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/phpmyadmin"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/server-status"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/**"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
