<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team & IAM - Nexus Compute</title>
<style>
  :root{--bg:#030712;--card:#0b1120;--accent:#38bdf8;--text:#f1f5f9;--muted:#94a3b8;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .container{max-width:900px;margin:40px auto;padding:0 24px}
  header{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid #1e293b;margin-bottom:32px}
  .logo{font-size:1.25rem;font-weight:800;letter-spacing:-0.025em;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  nav a{color:var(--muted);text-decoration:none;margin-left:24px;font-size:0.9rem}
  nav a:hover{color:var(--accent)}
  .card{background:var(--card);border:1px solid #1e293b;border-radius:12px;padding:24px}
  .card h3{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
  .card p{color:var(--muted);font-size:0.9rem;margin-bottom:16px}
  .btn{display:inline-block;padding:10px 20px;border-radius:8px;border:1px solid #334155;color:var(--text);text-decoration:none;font-size:0.9rem}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .footer{margin-top:40px;padding-top:24px;border-top:1px solid #1e293b;color:var(--muted);font-size:0.8rem;text-align:center}
  .hidden{position:absolute;opacity:0;width:0;height:0;overflow:hidden;pointer-events:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
</style>
</head>
<body>
<header>
  <div class="logo">NEXUS<span style="color:var(--accent)">COMPUTE</span> | Team & IAM</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="api.html">API Docs</a>
    <a href="login.html">Sign In</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>
<div class="container">
  <div class="card">
    <h2>Team Members</h2>
    <div class="grid">
      <div class="card" style="padding:20px">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;background:#334155;border-radius:50%"></div>
          <div style="flex:1">
            <div style="font-weight:600">Jane Smith</div>
            <div style="font-size:0.85rem;color:var(--muted)">Owner</div>
          </div>
          <div style="color:#22c55e;font-size:0.8rem">Admin</div>
        </div>
      </div>
      <div class="card" style="padding:20px">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;background:#334155;border-radius:50%"></div>
          <div style="flex:1">
            <div style="font-weight:600">Michael Chen</div>
            <div style="font-size:0.85rem;color:var(--muted)">Engineer</div>
          </div>
          <div style="color:#eab308;font-size:0.8rem">Developer</div>
        </div>
      </div>
      <div class="card" style="padding:20px">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;background:#334155;border-radius:50%"></div>
          <div style="flex:1">
            <div style="font-weight:600">Sarah Jenkins</div>
            <div style="font-size:0.85rem;color:var(--muted)">Billing</div>
          </div>
          <div style="color:#f59e0b;font-size:0.8rem">Billing</div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">
    &copy; 2026 Nexus Compute Inc. &bull;
    <a href="dashboard.html" style="color:var(--accent)">Dashboard</a>
  </div>
</div>
</body>
</html>
