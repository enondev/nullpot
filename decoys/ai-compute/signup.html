<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Nexus Compute</title>
<style>
  :root{--bg:#030712;--card:#0b1120;--accent:#38bdf8;--text:#f1f5f9;--muted:#94a3b8;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .container{max-width:460px;margin:40px auto;padding:0 24px}
  .card{background:var(--card);border:1px solid #1e293b;border-radius:12px;padding:40px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.3)}
  .logo{font-size:1.5rem;font-weight:800;letter-spacing:-0.025em;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:32px}
  h2{font-size:1.5rem;margin-bottom:20px}
  label{display:block;font-size:0.875rem;color:var(--muted);margin-bottom:8px;margin-top:16px}
  input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#020617;color:var(--text);font-size:1rem}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .btn{width:100%;padding:12px;border-radius:8px;background:var(--accent);color:#000;border:none;font-weight:600;font-size:1rem;cursor:pointer;margin-top:24px}
  .btn:hover{background:#7dd3fc}
  .checkbox{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:0.85rem;color:var(--muted)}
  .checkbox input{width:auto}
  .footer{margin-top:32px;text-align:center;font-size:0.8rem;color:var(--muted)}
  .hidden{position:absolute;opacity:0;width:0;height:0;overflow:hidden;pointer-events:none}
  .btn-oauth{display:flex;align-items:center;justify-content:center;width:100%;padding:10px 16px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);color:#fff;font-weight:500;font-size:0.9rem;cursor:pointer;transition:opacity 0.2s}
  .btn-oauth:hover{opacity:0.85}
  .btn-oauth:disabled{opacity:0.5;cursor:not-allowed}
<!-- Cloudflare Web Analytics - token injected during CI/CD -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{CF_WEB_ANALYTICS_TOKEN"}}'></script>
</style>
</head>
<body>

<!-- referral: /r/signup_ref_01 -->
<!-- webhook: https://hooks.nexuscompute.internal/fraud/webhook_01 -->

<div class="container">
  <div class="card">
    <div class="logo">NEXUS<span style="color:var(--accent)">COMPUTE</span></div>
    <h2>Create your account</h2>
    <form id="signupForm">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" placeholder="Jane Smith" required>

      <label for="workEmail">Work email</label>
      <input type="email" id="workEmail" name="workEmail" placeholder="jane@company.com" required>

      <label for="company">Company / organization</label>
      <input type="text" id="company" name="company" placeholder="Acme Corp" required>

      <label for="useCase">Primary use case</label>
      <select id="useCase" name="useCase">
        <option value="llm_training">LLM pre-training</option>
        <option value="fine_tuning">Model fine-tuning</option>
        <option value="inference">Production inference</option>
        <option value="research">Academic research</option>
      </select>

      <label for="gpubeam">Estimated monthly GPU spend</label>
      <select id="gpubeam" name="gpubeam">
        <option value="$0-500">$0 - $500</option>
        <option value="$500-5000">$500 - $5,000</option>
        <option value="$5000-50000">$5,000 - $50,000</option>
        <option value="$50000+">$50,000+</option>
      </select>

      <label for="password">Create password</label>
      <input type="password" id="password" name="password" placeholder="&#x25CF;&#x25CF;&#x25CF;&#x25CF;&#x25CF;&#x25CF;&#x25CF;&#x25CF;" required>

      <div class="checkbox">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the <a href="terms.html" style="color:var(--accent)">Terms of Service</a> and <a href="privacy.html" style="color:var(--accent)">Privacy Policy</a></label>
      </div>

      <button type="submit" class="btn">Create free account</button>
    </form>
    <div class="divider"><span>Or continue with</span></div>
    <div style="display:flex;gap:12px;margin-top:16px">
      <button class="btn btn-oauth" style="background:#ea4335;color:#fff" data-provider="google" data-trap="0">Google</button>
      <button class="btn btn-oauth" style="background:#24292f;color:#fff" data-provider="github" data-trap="1">GitHub</button>
      <button class="btn btn-oauth" style="background:#00a4ef;color:#fff" data-provider="microsoft" data-trap="1">Microsoft</button>
    </div>
    <div class="footer">
      Already have an account? <a href="login.html" style="color:var(--accent)">Sign in</a> &bull;
      <a href="contact.html" style="color:var(--accent)">Contact</a>
    </div>
  </div>
</div>

<div class="hidden">
  <input type="text" value="Stripe account nullpot_test_key_14">
  <input type="text" value="SendGrid API SG.L9m2n4p6q8t0v2x4z6a8c0e2g4i6k0m2">
  <textarea>-----BEGIN EC PRIVATE KEY-----
SIGNUP_HIDDEN_03_DO_NOT_COMMIT
-----END EC PRIVATE KEY-----</textarea>
</div>

<script src="telemetry.js"></script>
<script>
  __nexus.beacon('signup_page_load','pageview');
  __nexus.jitter(8000);
  document.getElementById('signupForm').addEventListener('submit',function(e){
    e.preventDefault();
    var fd=new FormData(this);
    var data={};
    for(var p of fd)data[p[0]]=p[1];
    __nexus.beacon('signup_submit','form_submit',data);
    var btn=this.querySelector('button');
    var orig=btn.innerText;
    btn.innerText='Creating account...';
    setTimeout(function(){
      btn.innerText='Account created. Redirecting...';
      setTimeout(function(){window.location.href='dashboard.html?t=signup_welcome_01';},1000);
    },1200);
  });

  // Fake OAuth buttons - beacon then redirect to trap or silent-post + error
  document.querySelectorAll('.btn-oauth').forEach(function(btn){
    btn.addEventListener('click',function(){
      var provider=this.getAttribute('data-provider');
      var trap=this.getAttribute('data-trap')==='1';
      __nexus.beacon('oauth_'+provider,'oauth_click',{provider:provider,trap:trap});
      var orig=btn.innerText;
      btn.disabled=true;
      btn.innerText='Redirecting to '+provider+'...';
      setTimeout(function(){
        if(trap){
          window.location.href='topology.html?node=oauth-'+provider+'&seed=oauth&depth=0';
        }else{
          __nexus.beacon('oauth_'+provider,'oauth_silent_post',{provider:provider});
          btn.disabled=false;
          btn.innerText=orig;
          var form=document.getElementById('signupForm');
          var status=document.createElement('div');
          status.style.marginTop='12px';
          status.style.padding='8px';
          status.style.borderRadius='6px';
          status.style.background='#1e1b4b';
          status.style.border='1px solid #4338ca';
          status.style.color='#c7d2fe';
          status.style.fontSize='0.85rem';
          status.textContent='Sign-in temporarily unavailable. Please try again later.';
          form.parentNode.insertBefore(status,form.nextSibling);
          setTimeout(function(){status.remove();},5000);
        }
      },1200);
    });
  });
</script>
</body>
</html>
